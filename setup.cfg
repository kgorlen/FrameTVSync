[metadata]
name = frametvsync
version = attr: frametvsync.__version__
author = Keith Gorlen
author_email = kgorlen@gmail.com
description = Export Lightroom Classic photos to Samsung Frame TV.
long_description = file: README.md, LICENSE.txt
url = https://github.com/kgorlen/frametvsync
keywords = Adobe Lightroom Classic, Samsung Frame TV
license = GPL-3.0-or-later
classifiers = 
    Programming Language :: Python :: 3.12
    Operating System :: OS Independent
    
[options]
include_package_data = True
package_dir=
    =src
packages = find:
python_requires = >=3.12
install_requires =
    build>=1.6.1
    pillow>=12.3.0
    pync>=2.0.3
    samsungtvws>=3.0.5
    watchdog>=6.0.0
    win11toast>=0.36.3

[options.packages.find]
where=src

[options.entry_points]
console_scripts =
    frametvsync = frametvsync.frametvsync:cli

gui_scripts =
    frametvsyncw = frametvsync.frametvsync:cli
